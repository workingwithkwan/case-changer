<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">
  <style>
    body { padding: 12px 16px; font-family: Roboto, Arial, sans-serif; color: #202124; }
    h2 { font-size: 13px; font-weight: 500; color: #5f6368; margin: 0 0 8px; }
    .hint { font-size: 12px; color: #5f6368; margin: 0 0 12px; line-height: 1.4; }
    /* add-ons1.css gives <button> a fixed height and bold text; reset both so the
       label sits centred inside the box instead of spilling out the bottom. */
    .btn {
      display: block; width: 100%; height: auto; box-sizing: border-box; margin: 0 0 8px;
      padding: 9px 12px; line-height: 20px; text-align: left; font-size: 14px;
      font-weight: 500; cursor: pointer;
      border: 1px solid #dadce0; border-radius: 6px; background: #fff; color: #202124;
    }
    .btn:hover { background: #f1f3f4; }
    .btn:active { background: #e8eaed; }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn .kbd { float: right; font-size: 11px; color: #80868b; }
    #status { font-size: 12px; min-height: 18px; margin-top: 6px; }
    #status.ok { color: #188038; }
    #status.err { color: #c5221f; }
    .footer { margin-top: 18px; font-size: 11px; color: #80868b; line-height: 1.4; }
    .btn.last { border-color: #1a73e8; box-shadow: inset 3px 0 0 #1a73e8; }
    #whole { display: none; margin-top: 8px; }
    #whole button { width: 100%; padding: 8px; font-size: 13px; border: 1px solid #1a73e8; background: #e8f0fe; color: #174ea6; border-radius: 6px; cursor: pointer; }
    details { margin-top: 16px; border-top: 1px solid #dadce0; padding-top: 10px; }
    summary { cursor: pointer; font-size: 13px; color: #202124; }
    .field { margin-top: 10px; font-size: 12px; }
    .field label { display: block; margin-bottom: 4px; color: #5f6368; }
    .field select, .field input[type=text] { width: 100%; box-sizing: border-box; font-size: 13px; padding: 5px 6px; border: 1px solid #dadce0; border-radius: 4px; }
    .check { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; margin-top: 10px; }
    .check input { margin: 2px 0 0; }
    #rate { display: none; margin-top: 14px; padding: 10px 12px; border: 1px solid #dadce0; border-radius: 6px; font-size: 12px; line-height: 1.4; background: #f8f9fa; }
    #rate a { color: #1a73e8; font-weight: 500; text-decoration: none; margin-right: 12px; }
    #rate button { background: none; border: none; color: #5f6368; font-size: 12px; cursor: pointer; padding: 0; }
    body.dark #rate { background: #2a2b2e; border-color: #444746; }
    body.dark #rate a { color: #8ab4f8; }
    #saved { font-size: 11px; color: #188038; min-height: 14px; margin-top: 4px; }
    .tools { display: flex; gap: 8px; margin: 0 0 10px; }
    .tools button { flex: 1; height: auto; padding: 7px 6px; line-height: 18px; font-size: 12px; font-weight: 500; cursor: pointer;
      border: 1px solid #1a73e8; border-radius: 6px; background: #e8f0fe; color: #174ea6; }
    .tools button:disabled { opacity: .5; cursor: default; }
    .pv { display: block; margin-top: 2px; font-size: 11px; font-weight: 400; color: #5f6368; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pv:empty { display: none; }
    .grouplabel { font-size: 11px; color: #80868b; margin: 2px 0 6px; text-transform: none; }
    .grouplabel:empty { display: none; }
    /* Dark sidebar: a manual switch in Settings, because the editors give add-ons no way to read their theme. */
    body.dark { background: #1f1f1f; color: #e3e3e3; }
    body.dark h2, body.dark .hint, body.dark .field label, body.dark .grouplabel, body.dark .footer, body.dark .pv { color: #a8abb0; }
    body.dark .btn { background: #2a2b2e; border-color: #444746; color: #e3e3e3; }
    body.dark .btn:hover { background: #35363a; }
    body.dark .btn:active { background: #3c4043; }
    body.dark .btn.last { border-color: #8ab4f8; box-shadow: inset 3px 0 0 #8ab4f8; }
    body.dark .tools button, body.dark #whole button { background: #1e2a3a; border-color: #8ab4f8; color: #a8c7fa; }
    body.dark details { border-top-color: #444746; }
    body.dark summary { color: #e3e3e3; }
    body.dark .field select, body.dark .field input[type=text] { background: #2a2b2e; border-color: #444746; color: #e3e3e3; }
    body.dark #status.ok, body.dark #saved { color: #81c995; }
    body.dark #status.err { color: #f28b82; }
  </style>
</head>
<body>
  <h2 data-i18n="heading"></h2>
  <p class="hint" data-i18n="hint"></p>

  <div class="tools">
    <button id="cycleBtn" data-i18n="cycle" data-i18n-title="cycleTip"></button>
    <button id="previewBtn" data-i18n="preview" data-i18n-title="previewTip"></button>
  </div>
  <div class="grouplabel" id="favLabel"></div>
  <div id="favs"></div>
  <div class="grouplabel" id="allLabel"></div>
  <div id="buttons">
    <button class="btn" data-mode="upper"></button>
    <button class="btn" data-mode="lower"></button>
    <button class="btn" data-mode="sentence"></button>
    <button class="btn" data-mode="title"></button>
    <button class="btn" data-mode="capitalize"></button>
    <button class="btn" data-mode="inverse"></button>
    <button class="btn" data-mode="alternating"></button>
    <button class="btn" data-mode="snake"></button>
    <button class="btn" data-mode="kebab"></button>
  </div>

  <div id="status"></div>
  <div id="whole"><button id="wholeBtn"></button></div>

  <div id="rate"><span data-i18n="rateAsk"></span><br><a id="rateYes" target="_blank" rel="noopener" data-i18n="rateYes"></a><button id="rateNo" data-i18n="rateNo"></button></div>

  <details>
    <summary data-i18n="settings"></summary>
    <label class="check"><input type="checkbox" id="keepAcronyms"> <span data-i18n="keepAcronyms"></span></label>
    <div class="field"><label for="language" data-i18n="languageLabel"></label>
      <select id="language"></select></div>
    <div class="field"><label for="extra" data-i18n="extraLabel"></label>
      <input type="text" id="extra" data-i18n-placeholder="extraPlaceholder"></div>
    <div class="field"><label for="protected" data-i18n="protectedLabel"></label>
      <input type="text" id="protected" data-i18n-placeholder="protectedPlaceholder"></div>
    <label class="check"><input type="checkbox" id="properNouns"> <span data-i18n="properNouns"></span></label>
    <label class="check"><input type="checkbox" id="skipHeader"> <span data-i18n="skipHeader"></span></label>
    <label class="check"><input type="checkbox" id="darkSidebar"> <span data-i18n="darkSidebar"></span></label>
    <div class="field"><label for="uiLanguage" data-i18n="uiLanguageLabel"></label>
      <select id="uiLanguage"></select></div>
    <div id="saved"></div>
  </details>

  <p class="footer" data-i18n="tip"></p>

  <script>
    // Interface text for the viewer's language, put in by Code.gs when the sidebar is built.
    var STR = <?!= strings ?>;
    var NAMES = <?!= names ?>;
    var HOST = '<?= host ?>';
    function fmt(text, vars) { return String(text).replace(/\{(\w+)\}/g, function (m, k) { return vars && vars.hasOwnProperty(k) ? vars[k] : m; }); }
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) { el.textContent = STR[el.getAttribute('data-i18n')] || ''; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-title]'), function (el) { el.title = STR[el.getAttribute('data-i18n-title')] || ''; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-placeholder]'), function (el) { el.placeholder = STR[el.getAttribute('data-i18n-placeholder')] || ''; });
    Array.prototype.forEach.call(document.querySelectorAll('.btn'), function (b) { b.textContent = STR['style_' + b.getAttribute('data-mode')] || b.getAttribute('data-mode'); });
    function fillLanguages(select) {
      var auto = document.createElement('option'); auto.value = 'auto'; select.appendChild(auto);
      Object.keys(NAMES).forEach(function (code) { var o = document.createElement('option'); o.value = code; o.textContent = NAMES[code]; select.appendChild(o); });
    }
    fillLanguages(document.getElementById('language'));
    fillLanguages(document.getElementById('uiLanguage'));
  </script>
  <script>
    var status = document.getElementById('status');
    var whole = document.getElementById('whole');
    var wholeBtn = document.getElementById('wholeBtn');
    var buttons = Array.prototype.slice.call(document.querySelectorAll('.btn'));
    var cycleBtn = document.getElementById('cycleBtn');
    var previewBtn = document.getElementById('previewBtn');
    var pendingMode = null;

    // Each button gets a line underneath for the preview text.
    buttons.forEach(function (b) { var pv = document.createElement('span'); pv.className = 'pv'; b.appendChild(pv); });

    function setBusy(busy) {
      buttons.forEach(function (b) { b.disabled = busy; });
      wholeBtn.disabled = busy; cycleBtn.disabled = busy; previewBtn.disabled = busy;
    }

    function clearPreviews() { buttons.forEach(function (b) { b.querySelector('.pv').textContent = ''; }); }

    // Favourites: the most used styles move to the top, the rest keep their order.
    function arrange(favs) {
      var favBox = document.getElementById('favs'), allBox = document.getElementById('buttons');
      favs = (favs || []).filter(function (m) { return buttons.some(function (b) { return b.getAttribute('data-mode') === m; }); });
      buttons.forEach(function (b) { allBox.appendChild(b); });
      favs.forEach(function (m) {
        buttons.forEach(function (b) { if (b.getAttribute('data-mode') === m) favBox.appendChild(b); });
      });
      document.getElementById('favLabel').textContent = favs.length ? STR.favLabel : '';
      document.getElementById('allLabel').textContent = favs.length ? STR.allLabel : '';
    }

    function show(msg, cls) {
      status.textContent = msg;
      status.className = cls;
      if (cls === 'ok') setTimeout(function () { if (status.textContent === msg) status.textContent = ''; }, 2500);
    }

    function markLast(mode) {
      buttons.forEach(function (b) { b.classList.toggle('last', b.getAttribute('data-mode') === mode); });
    }

    function failed(e) { setBusy(false); show(fmt(STR.wentWrong, { error: e.message }), 'err'); }

    function done(r) {
      setBusy(false);
      clearPreviews();
      if (r.mode) { pendingMode = r.mode; if (!r.needWhole) markLast(r.mode); }
      if (r.needWhole) {
        show(r.message, 'err');
        wholeBtn.textContent = STR['whole_' + (r.host || HOST)] || STR.whole_docs;
        whole.style.display = 'block';
        return;
      }
      whole.style.display = 'none';
      show(r.message, r.ok ? 'ok' : 'err');
    }

    buttons.forEach(function (b) {
      b.addEventListener('click', function () {
        pendingMode = b.getAttribute('data-mode');
        markLast(pendingMode);
        whole.style.display = 'none';
        setBusy(true);
        show(STR.working, '');
        google.script.run.withSuccessHandler(done).withFailureHandler(failed).applyCase(pendingMode);
      });
    });

    cycleBtn.addEventListener('click', function () {
      whole.style.display = 'none';
      setBusy(true);
      show(STR.working, '');
      google.script.run.withSuccessHandler(function (r) {
        if (r.needWhole && r.mode) pendingMode = r.mode;
        done(r);
      }).withFailureHandler(failed).cycleCase();
    });

    previewBtn.addEventListener('click', function () {
      setBusy(true);
      show(STR.reading, '');
      google.script.run.withSuccessHandler(function (r) {
        setBusy(false);
        if (!r.sample) { clearPreviews(); show(STR.nothingPreview, 'err'); return; }
        buttons.forEach(function (b) { b.querySelector('.pv').textContent = r.previews[b.getAttribute('data-mode')] || ''; });
        show(STR.previewDone, 'ok');
      }).withFailureHandler(failed).previewSelection();
    });

    wholeBtn.addEventListener('click', function () {
      if (!pendingMode) return;
      setBusy(true);
      show(STR.workingWhole, '');
      google.script.run.withSuccessHandler(done).withFailureHandler(failed).applyCaseWhole(pendingMode);
    });

    // Settings
    var keep = document.getElementById('keepAcronyms');
    var language = document.getElementById('language');
    var extra = document.getElementById('extra');
    var protectedWords = document.getElementById('protected');
    var properNouns = document.getElementById('properNouns');
    var skipHeader = document.getElementById('skipHeader');
    var darkSidebar = document.getElementById('darkSidebar');
    var savedNote = document.getElementById('saved');
    var saveTimer = null;

    var uiLanguage = document.getElementById('uiLanguage');
    function autoLabels(st) {
      if (!st) return;
      if (st.resolvedLanguage) language.options[0].textContent = fmt(STR.langAuto, { language: NAMES[st.resolvedLanguage] || st.resolvedLanguage });
      if (st.uiAccount) uiLanguage.options[0].textContent = fmt(STR.uiAuto, { language: NAMES[st.uiAccount] || st.uiAccount });
    }
    function loadSettings(st) {
      keep.checked = !!st.keepAcronyms;
      autoLabels(st);
      language.value = st.language || 'auto';
      uiLanguage.value = st.uiLanguage || 'auto';
      extra.value = st.extraSmallWords || '';
      protectedWords.value = st.protectedWords || '';
      properNouns.checked = st.properNouns !== false;
      skipHeader.checked = st.skipHeader !== false;
      darkSidebar.checked = !!st.darkSidebar;
      document.body.classList.toggle('dark', !!st.darkSidebar);
      arrange(st.favourites);
      if (st.lastMode) markLast(st.lastMode);
      var rate = document.getElementById('rate');
      if (st.askRating && st.listingUrl) {
        document.getElementById('rateYes').href = st.listingUrl;
        rate.style.display = 'block';
      }
    }
    function rateDone() {
      document.getElementById('rate').style.display = 'none';
      google.script.run.saveSettings({ rateDone: true });
    }
    document.getElementById('rateYes').addEventListener('click', rateDone);
    document.getElementById('rateNo').addEventListener('click', rateDone);
    function save(note) {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function () {
        google.script.run
          .withSuccessHandler(function (st) {
            var text = typeof note === 'string' ? note : STR.saved;
            savedNote.textContent = text;
            setTimeout(function () { if (savedNote.textContent === text) savedNote.textContent = ''; }, typeof note === 'string' ? 6000 : 1500);
            autoLabels(st);
          })
          .withFailureHandler(function (e) { savedNote.textContent = fmt(STR.couldNotSave, { error: e.message }); })
          .saveSettings({ keepAcronyms: keep.checked, language: language.value, extraSmallWords: extra.value,
                          protectedWords: protectedWords.value, properNouns: properNouns.checked, skipHeader: skipHeader.checked,
                          darkSidebar: darkSidebar.checked, uiLanguage: uiLanguage.value });
      }, 400);
    }
    keep.addEventListener('change', save);
    language.addEventListener('change', save);
    extra.addEventListener('input', save);
    protectedWords.addEventListener('input', save);
    properNouns.addEventListener('change', save);
    skipHeader.addEventListener('change', save);
    darkSidebar.addEventListener('change', function () { document.body.classList.toggle('dark', darkSidebar.checked); save(); });
    uiLanguage.addEventListener('change', function () { save(STR.saved + '. ' + STR.uiReload); });
    google.script.run.withSuccessHandler(loadSettings).withFailureHandler(function () {}).getSettings();
  </script>
</body>
</html>
